<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Pagos - Grúa y Parqueadero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header-title { background-color: #0d6efd; color: white; border-radius: 12px 12px 0 0; padding: 20px; }
    .bg-total { background-color: #e9ecef; font-weight: bold; }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="card mx-auto" style="max-width: 800px;">
    <div class="header-title text-center">
      <h3 class="mb-0">REGISTRO DE PAGOS - GRÚA Y PARQUEADERO</h3>
      <small>Secretaría de Movilidad - La Ceja, Antioquia</small>
    </div>
    
    <div class="card-body p-4">
      <form id="formRegistro" class="needs-validation" novalidate>
        
        <!-- DATOS DEL SOLICITANTE E INFRACTOR -->
        <h5 class="text-primary border-bottom pb-2 mb-3">Datos del Solicitante e Infractor</h5>
        <div class="row g-3 mb-3">
          <div class="col-md-12">
            <label for="nombre" class="form-label">Nombre del Solicitante *</label>
            <input type="text" class="form-control" id="nombre" name="NOMBRE" required>
          </div>
          <div class="col-md-6">
            <label for="cedulaInfractor" class="form-label">Cédula del Infractor *</label>
            <input type="text" class="form-control" id="cedulaInfractor" name="CÉDULA INFRACTOR" required>
          </div>
          <div class="col-md-6">
            <label for="cedulaPagador" class="form-label">Cédula del Pagador *</label>
            <input type="text" class="form-control" id="cedulaPagador" name="CÉDULA PAGADOR" required>
          </div>
          <div class="col-md-6">
            <label for="direccion" class="form-label">Dirección</label>
            <input type="text" class="form-control" id="direccion" name="DIRECCIÓN">
          </div>
          <div class="col-md-6">
            <label for="ciudad" class="form-label">Ciudad</label>
            <input type="text" class="form-control" id="ciudad" name="CIUDAD" value="La Ceja">
          </div>
          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" name="TELÉFONO">
          </div>
          <div class="col-md-6">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" name="CORREO ELECTRÓNICO">
          </div>
        </div>

        <!-- DATOS DEL VEHÍCULO Y LA INFRACCIÓN -->
        <h5 class="text-primary border-bottom pb-2 mb-3">Datos de la Infracción</h5>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="placa" class="form-label">Placa *</label>
            <input type="text" class="form-control text-uppercase" id="placa" name="PLACA" maxlength="6" required>
          </div>
          <div class="col-md-8">
            <label for="tipoInfraccion" class="form-label">Tipo de Infracción *</label>
            <select class="form-select" id="tipoInfraccion" name="TIPO DE INFRACCIÓN" required>
              <option value="">Cargando opciones...</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="nroComparendo" class="form-label">Nro. Comparendo *</label>
            <input type="text" class="form-control" id="nroComparendo" name="NRO COMPARENDO" required>
          </div>
          <div class="col-md-6">
            <label for="fecha" class="form-label">Fecha *</label>
            <input type="date" class="form-control" id="fecha" name="FECHA" required>
          </div>
        </div>

        <!-- VALORES PAGADOS EN ORDEN SOLICITADO -->
        <h5 class="text-primary border-bottom pb-2 mb-3">Liquidación de Pagos</h5>
        <div class="row g-3 mb-3">
          <div class="col-md-12">
            <label for="valorGrua" class="form-label">Valor Pagado Grúa *</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control val-calculo" id="valorGrua" name="VALOR PAGADO GRÚA" min="0" step="100" value="0" required>
            </div>
          </div>
          <div class="col-md-12">
            <label for="valorParqueadero" class="form-label">Valor Pagado Parqueadero *</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control val-calculo" id="valorParqueadero" name="VALOR PAGADO PARQUEADERO" min="0" step="100" value="0" required>
            </div>
          </div>
          <div class="col-md-12">
            <label for="totalPagado" class="form-label">Total Pagado</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="text" class="form-control bg-total" id="totalPagado" name="TOTAL PAGADO" readonly value="0">
            </div>
          </div>
        </div>

        <!-- DOCUMENTACIÓN Y FUNCIONARIO -->
        <h5 class="text-primary border-bottom pb-2 mb-3">Soportes y Registro</h5>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="fotocopia" class="form-label">Fotocopia Documento Identidad</label>
            <select class="form-select" id="fotocopia" name="FOTOCOPIA DEL DOCUMENTO DE IDENTIDAD">
              <option value="SI">SI</option>
              <option value="NO">NO</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="consignaciones" class="form-label">Consignaciones Originales</label>
            <select class="form-select" id="consignaciones" name="CONSIGNACIONES ORIGINALES">
              <option value="SI">SI</option>
              <option value="NO">NO</option>
            </select>
          </div>
          <div class="col-md-12">
            <label for="nombreFuncionario" class="form-label">Nombre del Funcionario *</label>
            <select class="form-select" id="nombreFuncionario" name="NOMBRE FUNCIONARIO" required>
              <option value="">Cargando opciones...</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-5" id="btnGuardar">
          Guardar y Generar PDF
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  let pagadorModificadoManualmente = false;

  document.addEventListener('DOMContentLoaded', () => {
    // Establecer fecha de hoy por defecto
    document.getElementById('fecha').valueToDate = new Date();
    document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

    // 1. AUTO-LLENADO DE CÉDULA DE PAGADOR DESDE INFRACTOR
    const inputInfractor = document.getElementById('cedulaInfractor');
    const inputPagador = document.getElementById('cedulaPagador');

    inputPagador.addEventListener('input', () => {
      pagadorModificadoManualmente = true;
    });

    inputInfractor.addEventListener('input', (e) => {
      if (!pagadorModificadoManualmente || inputPagador.value.trim() === '') {
        inputPagador.value = e.target.value;
      }
    });

    // 2. CÁLCULO AUTOMÁTICO DE TOTAL PAGADO
    const inputsValor = document.querySelectorAll('.val-calculo');
    inputsValor.forEach(input => {
      input.addEventListener('input', calcularTotal);
    });

    // 3. CARGAR LISTAS DESPLEGABLES (INFRACCIONES Y FUNCIONARIOS)
    cargarDesplegables();
  });

  function calcularTotal() {
    const grua = parseFloat(document.getElementById('valorGrua').value) || 0;
    const parqueadero = parseFloat(document.getElementById('valorParqueadero').value) || 0;
    const total = grua + parqueadero;
    document.getElementById('totalPagado').value = total.toLocaleString('es-CO');
  }

  function cargarDesplegables() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(llenarSelects)
        .withFailureHandler(err => console.error("Error al cargar opciones:", err))
        .obtenerOpcionesDesplegables();
    }
  }

  function llenarSelects(res) {
    if (!res || !res.success) return;

    const selectInf = document.getElementById('tipoInfraccion');
    const selectFunc = document.getElementById('nombreFuncionario');

    selectInf.innerHTML = '<option value="">Seleccione...</option>';
    res.infracciones.forEach(item => {
      selectInf.innerHTML += `<option value="${item}">${item}</option>`;
    });

    selectFunc.innerHTML = '<option value="">Seleccione...</option>';
    res.funcionarios.forEach(item => {
      selectFunc.innerHTML += `<option value="${item}">${item}</option>`;
    });
  }
</script>

</body>
</html>
