<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Pagos - Grúa y Parqueadero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0a3d62;
      --primary-light: #1e5a8e;
      --primary-dark: #062540;
      --accent: #d4a24c;
      --accent-light: #f4c675;
      --surface: #ffffff;
      --surface-alt: #f5f7fa;
      --border: #e1e8ed;
      --text: #1a2b3c;
      --text-muted: #6b7a8f;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(10, 61, 98, 0.08);
      --shadow-md: 0 4px 16px rgba(10, 61, 98, 0.1);
      --shadow-lg: 0 12px 40px rgba(10, 61, 98, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #eef4fa 0%, #d9e4f0 100%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 0;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(212, 162, 76, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(10, 61, 98, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container { position: relative; z-index: 1; }

    /* === TARJETA PRINCIPAL === */
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      background: var(--surface);
      animation: fadeInUp 0.6s ease-out;
    }

    /* === ENCABEZADO === */
    .header-title {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .header-title::before {
      content: "";
      position: absolute;
      top: -50%; right: -10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(212, 162, 76, 0.2) 0%, transparent 70%);
      border-radius: 50%;
    }

    .header-title h3 {
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .header-title small {
      opacity: 0.9;
      font-weight: 400;
      font-size: 0.875rem;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .header-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.15);
      border-radius: 14px;
      font-size: 1.75rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card-body { padding: 2.5rem; }

    @media (max-width: 576px) {
      .card-body { padding: 1.5rem; }
    }

    /* === SECCIONES === */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border);
    }

    .section-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .section-header h5 {
      margin: 0;
      color: var(--primary);
      font-weight: 600;
      font-size: 1.1rem;
      flex-grow: 1;
    }

    .section-icon { color: var(--accent); font-size: 1.25rem; }

    /* === CAMPOS === */
    .form-label {
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .form-label i { color: var(--primary-light); font-size: 0.875rem; }

    .form-control, .form-select {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      background-color: var(--surface-alt);
      color: var(--text);
    }

    .form-control:hover, .form-select:hover {
      border-color: var(--primary-light);
      background-color: white;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      background-color: white;
      box-shadow: 0 0 0 3px rgba(10, 61, 98, 0.1);
      outline: none;
    }

    .input-group-text {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      font-weight: 600;
      border-radius: 10px 0 0 10px !important;
    }

    .input-group .form-control {
      border-left: none;
      border-radius: 0 10px 10px 0 !important;
    }

    /* === TOTAL === */
    .total-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 14px;
      padding: 1.5rem;
      color: white;
      position: relative;
      overflow: hidden;
      margin-top: 1rem;
    }

    .total-card::after {
      content: "";
      position: absolute;
      top: -30px; right: -30px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(212, 162, 76, 0.25) 0%, transparent 70%);
      border-radius: 50%;
    }

    .total-label {
      font-size: 0.875rem;
      opacity: 0.85;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .total-amount {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      position: relative;
      z-index: 1;
    }

    .total-amount::before { content: "$ "; opacity: 0.8; }

    .payment-field {
      background: var(--surface-alt);
      padding: 1.25rem;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      margin-bottom: 0.75rem;
      transition: all 0.25s ease;
    }

    .payment-field:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* === BOTÓN === */
    .btn-primary-custom {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(10, 61, 98, 0.3);
      width: 100%;
    }

    .btn-primary-custom:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(10, 61, 98, 0.4);
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    }

    .btn-primary-custom:disabled { opacity: 0.7; cursor: not-allowed; }

    .was-validated .form-control:valid,
    .was-validated .form-select:valid { border-color: var(--success); }

    .was-validated .form-control:invalid,
    .was-validated .form-select:invalid {
      border-color: var(--danger);
      background-image: none;
    }

    .required-dot { color: var(--danger); font-weight: bold; }

    .form-footer {
      background: var(--surface-alt);
      padding: 1rem 2.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .form-footer i { color: var(--accent); }

    /* ============================================
       NOTIFICACIONES TOAST (reemplazan los alert)
       ============================================ */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .custom-toast {
      min-width: 340px;
      max-width: 440px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(10, 61, 98, 0.25);
      overflow: hidden;
      display: flex;
      align-items: stretch;
      position: relative;
      pointer-events: auto;
      animation: toastIn 0.45s cubic-bezier(0.21, 1.02, 0.73, 1);
    }

    .custom-toast.hiding { animation: toastOut 0.3s ease forwards; }

    .toast-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      font-size: 1.6rem;
      color: white;
      flex-shrink: 0;
    }

    .toast-success .toast-icon { background: linear-gradient(135deg, #10b981, #059669); }
    .toast-error .toast-icon   { background: linear-gradient(135deg, #ef4444, #dc2626); }

    .toast-body-custom { padding: 14px 16px; flex-grow: 1; }

    .toast-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 2px;
    }

    .toast-message { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    .toast-close {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 14px;
      cursor: pointer;
      align-self: flex-start;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .toast-close:hover { color: var(--text); }

    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      animation: toastProgress 4.5s linear forwards;
    }

    .toast-success .toast-progress { background: var(--success); }
    .toast-error .toast-progress   { background: var(--danger); }

    @media (max-width: 576px) {
      .toast-container { left: 16px; right: 16px; }
      .custom-toast { min-width: 0; width: 100%; max-width: 100%; }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(120%); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(120%); }
    }

    @keyframes toastProgress {
      from { width: 100%; }
      to   { width: 0%; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--surface-alt); }
    ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>
</head>
<body>

<!-- CONTENEDOR DE NOTIFICACIONES -->
<div class="toast-container" id="toastContainer"></div>

<div class="container my-4">
  <div class="card mx-auto" style="max-width: 850px;">
    
    <div class="header-title text-center">
      <div class="header-icon mx-auto">
        <i class="bi bi-shield-check"></i>
      </div>
      <h3 class="mb-0">REGISTRO DE PAGOS</h3>
      <small>
        <i class="bi bi-geo-alt-fill"></i>
        Secretaría de Movilidad - La Ceja, Antioquia
      </small>
    </div>
    
    <div class="card-body">
      <form id="formRegistro" class="needs-validation" novalidate>
        
        <div class="section-header">
          <span class="section-number">1</span>
          <h5>Datos del Solicitante e Infractor</h5>
          <i class="bi bi-person-badge section-icon"></i>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-12">
            <label for="nombre" class="form-label">
              <i class="bi bi-person-fill"></i> Nombre del Solicitante <span class="required-dot">*</span>
            </label>
            <input type="text" class="form-control" id="nombre" name="NOMBRE" required>
          </div>
          <div class="col-md-6">
            <label for="cedulaInfractor" class="form-label">
              <i class="bi bi-card-text"></i> Cédula del Infractor <span class="required-dot">*</span>
            </label>
            <input type="text" class="form-control" id="cedulaInfractor" name="CÉDULA INFRACTOR" required>
          </div>
          <div class="col-md-6">
            <label for="cedulaPagador" class="form-label">
              <i class="bi bi-wallet2"></i> Cédula del Pagador <span class="required-dot">*</span>
            </label>
            <input type="text" class="form-control" id="cedulaPagador" name="CÉDULA PAGADOR" required>
          </div>
          <div class="col-md-6">
            <label for="direccion" class="form-label">
              <i class="bi bi-house-door"></i> Dirección
            </label>
            <input type="text" class="form-control" id="direccion" name="DIRECCIÓN">
          </div>
          <div class="col-md-6">
            <label for="ciudad" class="form-label">
              <i class="bi bi-geo-alt"></i> Ciudad
            </label>
            <input type="text" class="form-control" id="ciudad" name="CIUDAD" value="La Ceja">
          </div>
          <div class="col-md-6">
            <label for="telefono" class="form-label">
              <i class="bi bi-telephone"></i> Teléfono
            </label>
            <input type="tel" class="form-control" id="telefono" name="TELÉFONO">
          </div>
          <div class="col-md-6">
            <label for="correo" class="form-label">
              <i class="bi bi-envelope"></i> Correo Electrónico
            </label>
            <input type="email" class="form-control" id="correo" name="CORREO ELECTRÓNICO">
          </div>
        </div>

        <div class="section-header">
          <span class="section-number">2</span>
          <h5>Datos de la Infracción</h5>
          <i class="bi bi-exclamation-triangle section-icon"></i>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label for="placa" class="form-label">
              <i class="bi bi-car-front"></i> Placa <span class="required-dot">*</span>
            </label>
            <input type="text" class="form-control text-uppercase" id="placa" name="PLACA" maxlength="6" required>
          </div>
          <div class="col-md-8">
            <label for="tipoInfraccion" class="form-label">
              <i class="bi bi-list-check"></i> Tipo de Infracción <span class="required-dot">*</span>
            </label>
            <select class="form-select" id="tipoInfraccion" name="TIPO DE INFRACCIÓN" required>
              <option value="">Cargando opciones...</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="nroComparendo" class="form-label">
              <i class="bi bi-file-earmark-text"></i> Nro. Comparendo <span class="required-dot">*</span>
            </label>
            <input type="text" class="form-control" id="nroComparendo" name="NRO COMPARENDO" required>
          </div>
          <div class="col-md-6">
            <label for="fecha" class="form-label">
              <i class="bi bi-calendar-event"></i> Fecha <span class="required-dot">*</span>
            </label>
            <input type="date" class="form-control" id="fecha" name="FECHA" required>
          </div>
        </div>

        <div class="section-header">
          <span class="section-number">3</span>
          <h5>Liquidación de Pagos</h5>
          <i class="bi bi-calculator section-icon"></i>
        </div>

        <div class="payment-field">
          <label for="valorGrua" class="form-label">
            <i class="bi bi-truck"></i> Valor Pagado Grúa <span class="required-dot">*</span>
          </label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control val-calculo" id="valorGrua" name="VALOR PAGADO GRÚA" min="0" step="100" value="0" required>
          </div>
        </div>

        <div class="payment-field">
          <label for="valorParqueadero" class="form-label">
            <i class="bi bi-p-square"></i> Valor Pagado Parqueadero <span class="required-dot">*</span>
          </label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control val-calculo" id="valorParqueadero" name="VALOR PAGADO PARQUEADERO" min="0" step="100" value="0" required>
          </div>
        </div>

        <div class="total-card">
          <div class="total-label">
            <i class="bi bi-receipt"></i> Total Pagado
          </div>
          <div class="total-amount" id="totalPagado">0</div>
          <input type="hidden" id="totalPagadoHidden" name="TOTAL PAGADO" value="0">
        </div>

        <div class="section-header mt-4">
          <span class="section-number">4</span>
          <h5>Soportes y Registro</h5>
          <i class="bi bi-folder-check section-icon"></i>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="fotocopia" class="form-label">
              <i class="bi bi-file-earmark-person"></i> Fotocopia Documento Identidad
            </label>
            <select class="form-select" id="fotocopia" name="FOTOCOPIA DEL DOCUMENTO DE IDENTIDAD">
              <option value="SI">✓ SI</option>
              <option value="NO">✗ NO</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="consignaciones" class="form-label">
              <i class="bi bi-cash-stack"></i> Consignaciones Originales
            </label>
            <select class="form-select" id="consignaciones" name="CONSIGNACIONES ORIGINALES">
              <option value="SI">✓ SI</option>
              <option value="NO">✗ NO</option>
            </select>
          </div>
          <div class="col-md-12">
            <label for="nombreFuncionario" class="form-label">
              <i class="bi bi-person-workspace"></i> Nombre del Funcionario <span class="required-dot">*</span>
            </label>
            <select class="form-select" id="nombreFuncionario" name="NOMBRE FUNCIONARIO" required>
              <option value="">Cargando opciones...</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary-custom" id="btnGuardar">
          <i class="bi bi-file-earmark-pdf"></i>
          Guardar y Generar PDF
        </button>
      </form>
    </div>

    <div class="form-footer">
      <span><i class="bi bi-shield-lock-fill"></i> Datos protegidos · Sistema institucional</span>
      <span>Secretaría de Movilidad · La Ceja © 2026</span>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwxNOkoiyi4MKEmx1TS11nR--wKNPhHGdbKOCLG3O4JEALVc9idiPjDi0thUyd69np_/exec';

  let pagadorModificadoManualmente = false;

  /* ============================================
     SISTEMA DE NOTIFICACIONES TOAST
     ============================================ */
  function mostrarToast(tipo, titulo, mensaje) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `custom-toast toast-${tipo}`;

    const icon = tipo === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';

    toast.innerHTML = `
      <div class="toast-icon"><i class="bi ${icon}"></i></div>
      <div class="toast-body-custom">
        <div class="toast-title">${titulo}</div>
        <div class="toast-message">${mensaje}</div>
      </div>
      <button class="toast-close" onclick="cerrarToast(this)" title="Cerrar">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="toast-progress"></div>
    `;

    container.appendChild(toast);

    // Se cierra solo después de 4.5 segundos
    setTimeout(() => {
      if (toast.parentNode) {
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 300);
      }
    }, 4500);
  }

  function cerrarToast(btn) {
    const toast = btn.closest('.custom-toast');
    toast.classList.add('hiding');
    setTimeout(() => toast.remove(), 300);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

    const inputInfractor = document.getElementById('cedulaInfractor');
    const inputPagador = document.getElementById('cedulaPagador');

    inputPagador.addEventListener('input', () => {
      pagadorModificadoManualmente = true;
    });

    inputInfractor.addEventListener('input', (e) => {
      if (!pagadorModificadoManualmente || inputPagador.value.trim() === '') {
        inputPagador.value = e.target.value;
      }
    });

    document.querySelectorAll('.val-calculo').forEach(input => {
      input.addEventListener('input', calcularTotal);
    });

    cargarDesplegables();
  });

  function calcularTotal() {
    const grua = parseFloat(document.getElementById('valorGrua').value) || 0;
    const parqueadero = parseFloat(document.getElementById('valorParqueadero').value) || 0;
    const total = grua + parqueadero;
    document.getElementById('totalPagado').textContent = total.toLocaleString('es-CO');
    document.getElementById('totalPagadoHidden').value = total;
  }

  async function cargarDesplegables() {
    const selectInf = document.getElementById('tipoInfraccion');
    const selectFunc = document.getElementById('nombreFuncionario');

    try {
      const response = await fetch(`${WEB_APP_URL}?api=opciones`);
      const res = await response.json();

      if (res.success) {
        selectInf.innerHTML = '<option value="">Seleccione una opción...</option>';
        (res.infracciones || []).forEach(item => {
          selectInf.innerHTML += `<option value="${item}">${item}</option>`;
        });

        selectFunc.innerHTML = '<option value="">Seleccione un funcionario...</option>';
        (res.funcionarios || []).forEach(item => {
          selectFunc.innerHTML += `<option value="${item}">${item}</option>`;
        });
      } else {
        throw new Error(res.message);
      }
    } catch (error) {
      console.error('Error cargando desplegables:', error);
      selectInf.innerHTML = '<option value="">Error al cargar opciones</option>';
      selectFunc.innerHTML = '<option value="">Error al cargar opciones</option>';
    }
  }

  document.getElementById('formRegistro').addEventListener('submit', async function(e) {
    e.preventDefault();

    if (!this.checkValidity()) {
      e.stopPropagation();
      this.classList.add('was-validated');
      mostrarToast('error', 'Campos incompletos', 'Por favor diligencia todos los campos obligatorios marcados con *.');
      return;
    }

    const btnGuardar = document.getElementById('btnGuardar');
    btnGuardar.disabled = true;
    btnGuardar.innerHTML = '<i class="bi bi-hourglass-split"></i> Procesando y generando PDF...';

    try {
      const formData = new FormData(this);
      const dataObj = {};
      formData.forEach((value, key) => {
        dataObj[key] = value;
      });

      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataObj)
      });

      const res = await response.json();

      if (res.success) {
        // ✅ NUEVO MENSAJE: toast moderno en lugar del alert nativo
        mostrarToast('success', '¡Registro guardado con éxito!', 'Los datos fueron almacenados correctamente. El PDF se descargará en unos segundos.');

        if (res.pdfBase64) {
          const link = document.createElement('a');
          link.href = 'data:application/pdf;base64,' + res.pdfBase64;
          link.download = res.pdfNombre || 'Registro_Pago.pdf';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }

        this.reset();
        this.classList.remove('was-validated');
        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        pagadorModificadoManualmente = false;
        calcularTotal();

      } else {
        throw new Error(res.message || 'Error guardando los datos.');
      }

    } catch (error) {
      console.error('Error enviando datos:', error);
      mostrarToast('error', 'Ocurrió un error', error.message);
    } finally {
      btnGuardar.disabled = false;
      btnGuardar.innerHTML = '<i class="bi bi-file-earmark-pdf"></i> Guardar y Generar PDF';
    }
  });
</script>

</body>
</html>
