<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pagos - Grúa y Parqueadero</title>

    <style>
        :root {
            --primary: #004a99;
            --primary-dark: #003b7a;
            --secondary: #f4f7f6;
            --accent: #28a745;
            --accent-dark: #218838;
            --danger: #dc3545;
            --text: #333;
            --muted: #666;
            --border: #ccc;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #e9ecef;
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,.10);
        }

        header {
            text-align: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        header h2 {
            font-size: 1.05rem;
            color: var(--muted);
            font-weight: 600;
            margin: 7px 0 0;
        }

        .alert {
            padding: 14px 16px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
            font-weight: 600;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: var(--secondary);
            border-radius: 7px;
            border-left: 5px solid var(--primary);
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--primary);
            margin: 0 0 18px;
            display: flex;
            align-items: center;
        }

        .section-title span {
            background: var(--primary);
            color: #fff;
            width: 29px;
            height: 29px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-size: .9rem;
            flex: 0 0 auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: .9rem;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 1rem;
            background: #fff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0,74,153,.15);
        }

        input[readonly] {
            background: #e9ecef;
            font-weight: 700;
            color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 25px;
            padding-top: 8px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
            margin: 0;
        }

        .radio-group input {
            width: auto;
        }

        .btn-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 30px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            max-width: 380px;
        }

        button:hover {
            background: var(--accent-dark);
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            font-size: .84rem;
            color: #777;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .loader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader-overlay.active {
            display: flex;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            color: var(--primary);
            font-weight: 600;
            text-align: center;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            header h1 {
                font-size: 1.45rem;
            }

            header h2 {
                font-size: .95rem;
            }

            .section {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loaderText">
        Procesando y generando PDF...
    </div>
</div>

<div class="container">

    <header>
        <h1>Secretaría de Movilidad V1</h1>
        <h2>
            FORMATO DE REGISTRO DE PAGOS POR CONCEPTO DEL
            SERVICIO DE GRÚA Y PARQUEADERO
        </h2>
    </header>

    <div id="alertBox" class="alert"></div>

    <form id="registroForm" novalidate>

        <!-- ==================================================
             1. INFORMACIÓN GENERAL
        =================================================== -->
        <div class="section">

            <h3 class="section-title">
                <span>1</span>
                Información General
            </h3>

            <div class="form-grid">

                <div class="form-group full-width">
                    <label for="nombre">
                        Nombre Solicitante *
                    </label>
                    <input
                        id="nombre"
                        type="text"
                        name="NOMBRE"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="cedulaInfractor">
                        Cédula Infractor *
                    </label>
                    <input
                        id="cedulaInfractor"
                        type="text"
                        name="CÉDULA INFRACTOR"
                        required>
                </div>

                <div class="form-group">
                    <label for="cedulaPagador">
                        Cédula Pagador *
                    </label>
                    <input
                        id="cedulaPagador"
                        type="text"
                        name="CÉDULA PAGADOR"
                        required>
                </div>

                <div class="form-group">
                    <label for="direccion">
                        Dirección
                    </label>
                    <input
                        id="direccion"
                        type="text"
                        name="DIRECCIÓN">
                </div>

                <div class="form-group">
                    <label for="ciudad">
                        Ciudad
                    </label>
                    <input
                        id="ciudad"
                        type="text"
                        name="CIUDAD"
                        value="La Ceja">
                </div>

                <div class="form-group">
                    <label for="telefono">
